<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURALNET — PCB Grid World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #game-container { width: 100vw; height: 100vh; }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 12px; left: 12px;
    color: #00ffcc;
    font-size: 11px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #00ffcc;
    pointer-events: none;
    line-height: 1.9;
  }
  #hud .title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ff00ff;
    text-shadow: 0 0 12px #ff00ff;
    margin-bottom: 4px;
  }
  #hud-cell-info {
    margin-top: 6px;
    font-size: 10px;
    color: #aaffdd;
    line-height: 1.7;
    min-height: 32px;
  }
  #hud-cell-info span { color: #ffffff; }

  #controls {
    position: fixed;
    bottom: 12px; right: 12px;
    color: #0088ff;
    font-size: 10px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #0088ff;
    pointer-events: none;
    text-align: right;
    line-height: 1.8;
  }
  #minimap {
    position: fixed;
    bottom: 12px; left: 12px;
    width: 120px; height: 120px;
    border: 1px solid #00ffcc33;
    background: #000811;
  }
  #minimap canvas { width: 120px; height: 120px; }
</style>
</head>
<body>
<div id="game-container"></div>

<div id="hud">
  <div class="title">NEURALNET</div>
  <div id="hud-coords">SECTOR: 0,0</div>
  <div id="hud-zoom">ZOOM: 1.00x</div>
  <div id="hud-fps">FPS: --</div>
  <div id="hud-cell-info"></div>
</div>

<div id="controls">
  DRAG: pan world<br>
  SCROLL / PINCH: zoom<br>
  WASD / ARROWS: move<br>
  CLICK: inspect cell
</div>

<div id="minimap">
  <canvas id="minimap-canvas" width="120" height="120"></canvas>
</div>

<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────────────
  // CELL STATE ENUM
  // ─────────────────────────────────────────────────────────────────────────────
  const STATE = Object.freeze({ EMPTY: 0, COMPONENT: 1, LINK: 2 });

  // ─────────────────────────────────────────────────────────────────────────────
  // COMPONENT TYPE ENUM
  // ─────────────────────────────────────────────────────────────────────────────
  const COMP = Object.freeze({
    CPU:           'CPU',
    RAM:           'RAM',
    POWER:         'POWER',
    ENEMY_NODE:    'ENEMY_NODE',
    RESOURCE_NODE: 'RESOURCE_NODE',
  });

  // ─────────────────────────────────────────────────────────────────────────────
  // WORLD CONSTANTS
  // ─────────────────────────────────────────────────────────────────────────────
  const GRID_COLS = 80;
  const GRID_ROWS = 80;
  const CELL_SIZE = 48;
  const WORLD_W   = GRID_COLS * CELL_SIZE;   // 3840
  const WORLD_H   = GRID_ROWS * CELL_SIZE;   // 3840

  const ZOOM_MIN  = 0.25;
  const ZOOM_MAX  = 3.0;
  const ZOOM_STEP = 0.1;
  const CAM_SPEED = 6;

  // ─────────────────────────────────────────────────────────────────────────────
  // PALETTE
  // ─────────────────────────────────────────────────────────────────────────────
  const C = {
    bg:        0x000811,
    gridLine:  0x003322,
    gridMajor: 0x004433,
    linkCore:  0x00cc88,
    linkGlow:  0x00ffcc,
    select:    0xffffff,

    [COMP.CPU]:           { fill: 0x001a3d, border: 0x0066ff, glow: 0x0099ff, css: '#0099ff' },
    [COMP.RAM]:           { fill: 0x001a2a, border: 0x00ccff, glow: 0x00eeff, css: '#00eeff' },
    [COMP.POWER]:         { fill: 0x2a1400, border: 0xff8800, glow: 0xffaa00, css: '#ffcc00' },
    [COMP.ENEMY_NODE]:    { fill: 0x1a0008, border: 0xff0044, glow: 0xff2255, css: '#ff4466' },
    [COMP.RESOURCE_NODE]: { fill: 0x001a0a, border: 0x00ff66, glow: 0x44ff88, css: '#00ff88' },
  };

  // ─────────────────────────────────────────────────────────────────────────────
  // SEEDED PRNG  (xorshift32)
  // ─────────────────────────────────────────────────────────────────────────────
  function makeRng(seed) {
    let s = seed >>> 0;
    return () => {
      s ^= s << 13; s ^= s >> 17; s ^= s << 5;
      return (s >>> 0) / 0xffffffff;
    };
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // GRID CLASS
  //   Each cell is exactly one state — no mixing.
  //   writeIfEmpty enforces exclusivity at write time.
  // ─────────────────────────────────────────────────────────────────────────────
  class Grid {
    constructor(cols, rows) {
      this.cols = cols;
      this.rows = rows;
      this._cells = Array.from({ length: cols * rows }, () => ({ state: STATE.EMPTY }));
    }

    inBounds(col, row) {
      return col >= 0 && col < this.cols && row >= 0 && row < this.rows;
    }

    get(col, row) {
      if (!this.inBounds(col, row)) return null;
      return this._cells[row * this.cols + col];
    }

    _write(col, row, cell) {
      if (!this.inBounds(col, row)) return false;
      this._cells[row * this.cols + col] = cell;
      return true;
    }

    // Only writes if the cell is currently EMPTY — enforces one-state-per-cell
    writeIfEmpty(col, row, cell) {
      const cur = this.get(col, row);
      if (!cur || cur.state !== STATE.EMPTY) return false;
      return this._write(col, row, cell);
    }

    isEmpty(col, row) {
      const c = this.get(col, row);
      return c !== null && c.state === STATE.EMPTY;
    }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // LINK PATH ROUTER
  //   Manhattan L-path; refuses to cross any non-EMPTY cell.
  //   Returns intermediate [{col,row}] (excludes endpoints), or null if blocked.
  // ─────────────────────────────────────────────────────────────────────────────
  function routeLinkPath(grid, src, dst, horizFirst) {
    const cells = [];
    let col = src.col, row = src.row;

    const sc = Math.sign(dst.col - col);
    const sr = Math.sign(dst.row - row);

    const step = (c, r) => {
      if (c === src.col && r === src.row) return true;
      if (c === dst.col && r === dst.row) return true;
      if (!grid.isEmpty(c, r)) return false;
      cells.push({ col: c, row: r });
      return true;
    };

    if (horizFirst) {
      while (col !== dst.col) { col += sc; if (!step(col, row)) return null; }
      while (row !== dst.row) { row += sr; if (!step(col, row)) return null; }
    } else {
      while (row !== dst.row) { row += sr; if (!step(col, row)) return null; }
      while (col !== dst.col) { col += sc; if (!step(col, row)) return null; }
    }

    return cells.length > 0 ? cells : null;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // WORLD GENERATOR  — deterministic from seed
  // ─────────────────────────────────────────────────────────────────────────────
  function generateWorld(seed) {
    const rng  = makeRng(seed);
    const grid = new Grid(GRID_COLS, GRID_ROWS);

    // Component placement
    const blueprint = [
      COMP.CPU, COMP.CPU,
      COMP.RAM, COMP.RAM, COMP.RAM, COMP.RAM,
      COMP.POWER, COMP.POWER, COMP.POWER,
      COMP.ENEMY_NODE, COMP.ENEMY_NODE, COMP.ENEMY_NODE,
      COMP.ENEMY_NODE, COMP.ENEMY_NODE, COMP.ENEMY_NODE,
      COMP.RESOURCE_NODE, COMP.RESOURCE_NODE, COMP.RESOURCE_NODE,
      COMP.RESOURCE_NODE, COMP.RESOURCE_NODE, COMP.RESOURCE_NODE,
    ];

    const components = [];
    let nextId = 1;

    for (const compType of blueprint) {
      for (let attempt = 0; attempt < 300; attempt++) {
        const col = 2 + Math.floor(rng() * (GRID_COLS - 4));
        const row = 2 + Math.floor(rng() * (GRID_ROWS - 4));
        const cell = {
          state:    STATE.COMPONENT,
          id:       nextId,
          compType,
          pulse:    rng() * Math.PI * 2,
          speed:    0.7 + rng() * 1.4,
        };
        if (grid.writeIfEmpty(col, row, cell)) {
          components.push({ col, row, ...cell });
          nextId++;
          break;
        }
      }
    }

    // Link routing — a LINK cell must connect exactly two COMPONENTs
    const linkSegments = [];
    const linkCount    = {};
    components.forEach(c => { linkCount[c.id] = 0; });

    for (const src of components) {
      if (linkCount[src.id] >= 3) continue;

      const nearby = components
        .filter(c => c.id !== src.id)
        .map(c => ({ ...c, dist: Math.abs(c.col - src.col) + Math.abs(c.row - src.row) }))
        .sort((a, b) => a.dist - b.dist);

      for (const dst of nearby) {
        if (linkCount[src.id] >= 3) break;
        if (linkCount[dst.id] >= 3) continue;
        if (dst.dist > 22)          break;

        const alreadyLinked = linkSegments.some(
          s => (s.fromId === src.id && s.toId === dst.id) ||
               (s.fromId === dst.id && s.toId === src.id)
        );
        if (alreadyLinked) continue;

        const seg = routeLinkPath(grid, src, dst, rng() > 0.5)
                 ?? routeLinkPath(grid, src, dst, rng() <= 0.5);
        if (!seg) continue;

        const segIdx = linkSegments.length;
        linkSegments.push({ fromId: src.id, toId: dst.id, cells: seg });

        for (const { col, row } of seg) {
          grid.writeIfEmpty(col, row, {
            state: STATE.LINK, fromId: src.id, toId: dst.id, segIdx,
          });
        }

        linkCount[src.id]++;
        linkCount[dst.id]++;
      }
    }

    return { grid, components, linkSegments };
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PHASER SCENE
  // ─────────────────────────────────────────────────────────────────────────────
  class PCBScene extends Phaser.Scene {
    constructor() {
      super({ key: 'PCBScene' });

      const world       = generateWorld(0xDEADBEEF);
      this.grid         = world.grid;
      this.components   = world.components;
      this.linkSegments = world.linkSegments;

      this.camX          = WORLD_W / 2;
      this.camY          = WORLD_H / 2;
      this.zoom          = 1.0;
      this.isDragging    = false;
      this._didDrag      = false;
      this.dragStartX    = 0;
      this.dragStartY    = 0;
      this.dragCamStartX = 0;
      this.dragCamStartY = 0;
      this.selectedCell  = null;
      this.time_t        = 0;
      this.fpsTimer      = 0;
      this.fpsCount      = 0;
      this.fpsDisplay    = 60;
      this.pinchDist     = 0;
    }

    preload() {}

    create() {
      // Static graphics — drawn once, stays in scene, Phaser renders via camera
      this.staticGfx = this.add.graphics();
      this._drawStaticWorld();

      // Component labels — Text objects live in the scene at world coordinates
      this._createLabels();

      // Dynamic graphics — cleared and redrawn every frame
      this.dynGfx = this.add.graphics();

      // Camera
      this.cameras.main.setBackgroundColor(C.bg);
      this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
      this.cameras.main.setZoom(this.zoom);
      this.cameras.main.centerOn(this.camX, this.camY);

      // Keyboard
      this.cursors = this.input.keyboard.createCursorKeys();
      this.wasd = this.input.keyboard.addKeys({
        up:    Phaser.Input.Keyboard.KeyCodes.W,
        down:  Phaser.Input.Keyboard.KeyCodes.S,
        left:  Phaser.Input.Keyboard.KeyCodes.A,
        right: Phaser.Input.Keyboard.KeyCodes.D,
      });

      // Mouse wheel zoom
      this.input.on('wheel', (_ptr, _o, _dx, dy) => {
        this._applyZoom(dy > 0 ? -ZOOM_STEP : ZOOM_STEP, _ptr.x, _ptr.y);
      });

      // Drag
      this.input.on('pointerdown', (ptr) => {
        this.isDragging    = true;
        this._didDrag      = false;
        this.dragStartX    = ptr.x;
        this.dragStartY    = ptr.y;
        this.dragCamStartX = this.camX;
        this.dragCamStartY = this.camY;
      });
      this.input.on('pointermove', (ptr) => {
        // Pinch-to-zoom
        const ptrs = this.input.manager.pointers.filter(p => p.isDown);
        if (ptrs.length >= 2) {
          const d = Phaser.Math.Distance.Between(ptrs[0].x, ptrs[0].y, ptrs[1].x, ptrs[1].y);
          if (this.pinchDist > 0) {
            this._applyZoom(
              (d - this.pinchDist) * 0.005,
              (ptrs[0].x + ptrs[1].x) / 2,
              (ptrs[0].y + ptrs[1].y) / 2
            );
          }
          this.pinchDist = d;
          return;
        }
        this.pinchDist = 0;
        if (!this.isDragging) return;
        const dx = (ptr.x - this.dragStartX) / this.zoom;
        const dy = (ptr.y - this.dragStartY) / this.zoom;
        if (Math.abs(dx) + Math.abs(dy) > 4) {
          this._didDrag = true;
          this.camX = this.dragCamStartX - dx;
          this.camY = this.dragCamStartY - dy;
          this._clampCamera();
        }
      });
      this.input.on('pointerup', (ptr) => {
        if (!this._didDrag) this._handleClick(ptr);
        this.isDragging = false;
      });

      // Minimap
      this._buildMinimap();
    }

    // ── Static world (Graphics object, drawn once) ────────────────────────────
    _drawStaticWorld() {
      const g  = this.staticGfx;
      const CS = CELL_SIZE;

      // Background
      g.fillStyle(C.bg);
      g.fillRect(0, 0, WORLD_W, WORLD_H);

      // Minor grid
      g.lineStyle(1, C.gridLine, 0.35);
      for (let c = 0; c <= GRID_COLS; c++) {
        g.beginPath();
        g.moveTo(c * CS, 0);
        g.lineTo(c * CS, WORLD_H);
        g.strokePath();
      }
      for (let r = 0; r <= GRID_ROWS; r++) {
        g.beginPath();
        g.moveTo(0, r * CS);
        g.lineTo(WORLD_W, r * CS);
        g.strokePath();
      }

      // Major grid every 8 cells
      g.lineStyle(1, C.gridMajor, 0.2);
      for (let c = 0; c <= GRID_COLS; c += 8) {
        g.beginPath();
        g.moveTo(c * CS, 0);
        g.lineTo(c * CS, WORLD_H);
        g.strokePath();
      }
      for (let r = 0; r <= GRID_ROWS; r += 8) {
        g.beginPath();
        g.moveTo(0, r * CS);
        g.lineTo(WORLD_W, r * CS);
        g.strokePath();
      }

      // LINK cells
      this._drawLinks(g);

      // COMPONENT cells
      this._drawComponents(g);
    }

    _drawLinks(g) {
      const CS = CELL_SIZE;
      const HS = CS / 2;
      const { grid } = this;

      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          if (grid.get(c, r).state !== STATE.LINK) continue;

          const cx = c * CS + HS;
          const cy = r * CS + HS;

          const connH = this._linkConnects(c - 1, r) || this._linkConnects(c + 1, r);
          const connV = this._linkConnects(c, r - 1) || this._linkConnects(c, r + 1);

          if (connH) {
            g.lineStyle(6, C.linkGlow, 0.07);
            g.beginPath(); g.moveTo(cx - HS, cy); g.lineTo(cx + HS, cy); g.strokePath();
            g.lineStyle(2, C.linkCore, 0.9);
            g.beginPath(); g.moveTo(cx - HS, cy); g.lineTo(cx + HS, cy); g.strokePath();
          }
          if (connV) {
            g.lineStyle(6, C.linkGlow, 0.07);
            g.beginPath(); g.moveTo(cx, cy - HS); g.lineTo(cx, cy + HS); g.strokePath();
            g.lineStyle(2, C.linkCore, 0.9);
            g.beginPath(); g.moveTo(cx, cy - HS); g.lineTo(cx, cy + HS); g.strokePath();
          }
          if (connH && connV) {
            g.fillStyle(C.linkGlow, 0.85);
            g.fillCircle(cx, cy, 3);
          }
        }
      }
    }

    _linkConnects(col, row) {
      const cell = this.grid.get(col, row);
      return cell !== null && (cell.state === STATE.LINK || cell.state === STATE.COMPONENT);
    }

    _drawComponents(g) {
      const CS = CELL_SIZE;
      const HS = CS / 2;

      this.components.forEach(comp => {
        const px  = comp.col * CS;
        const py  = comp.row * CS;
        const cx  = px + HS;
        const cy  = py + HS;
        const pal = C[comp.compType];

        // Outer glow halo
        g.fillStyle(pal.glow, 0.07);
        g.fillRect(px - 5, py - 5, CS + 10, CS + 10);

        // Body
        g.fillStyle(pal.fill, 1);
        g.fillRect(px + 2, py + 2, CS - 4, CS - 4);

        // Border
        g.lineStyle(2, pal.border, 1);
        g.strokeRect(px + 2, py + 2, CS - 4, CS - 4);

        // Inner ring
        g.lineStyle(1, pal.glow, 0.4);
        g.strokeRect(px + 7, py + 7, CS - 14, CS - 14);

        // Center diamond
        const dr = 7;
        g.lineStyle(1, pal.glow, 0.8);
        g.beginPath();
        g.moveTo(cx,      cy - dr);
        g.lineTo(cx + dr, cy);
        g.lineTo(cx,      cy + dr);
        g.lineTo(cx - dr, cy);
        g.closePath();
        g.strokePath();

        // Center dot
        g.fillStyle(pal.glow, 1);
        g.fillCircle(cx, cy, 2.5);

        // Pin stubs toward connected LINK cells
        const sides = [
          { dc: -1, dr: 0, ax: px,          ay: cy, bx: px + 5,      by: cy },
          { dc:  1, dr: 0, ax: px + CS - 5, ay: cy, bx: px + CS,     by: cy },
          { dc:  0, dr: -1, ax: cx,          ay: py, bx: cx,          by: py + 5 },
          { dc:  0, dr:  1, ax: cx,          ay: py + CS - 5, bx: cx, by: py + CS },
        ];
        g.lineStyle(2, pal.border, 0.7);
        sides.forEach(s => {
          const nc = this.grid.get(comp.col + s.dc, comp.row + s.dr);
          if (nc && nc.state === STATE.LINK) {
            g.beginPath();
            g.moveTo(s.ax, s.ay);
            g.lineTo(s.bx, s.by);
            g.strokePath();
          }
        });
      });
    }

    // Labels are Text objects living in the scene at world coordinates
    _createLabels() {
      const CS = CELL_SIZE;
      const short = {
        [COMP.CPU]:           'CPU',
        [COMP.RAM]:           'RAM',
        [COMP.POWER]:         'PWR',
        [COMP.ENEMY_NODE]:    'ENM',
        [COMP.RESOURCE_NODE]: 'RES',
      };
      this.components.forEach(comp => {
        const pal = C[comp.compType];
        this.add.text(
          comp.col * CS + CS / 2,
          comp.row * CS + CS / 2,
          short[comp.compType],
          {
            fontSize: '9px',
            fontFamily: 'Courier New',
            fontStyle: 'bold',
            color: pal.css,
            stroke: '#000000',
            strokeThickness: 3,
            align: 'center',
          }
        ).setOrigin(0.5, 0.5);
      });
    }

    // ── Minimap ───────────────────────────────────────────────────────────────
    _buildMinimap() {
      this._mmCtx = document.getElementById('minimap-canvas').getContext('2d');
      this._drawMinimapStatic();
    }

    _drawMinimapStatic() {
      const ctx = this._mmCtx;
      const mw = 120, mh = 120;
      const sx = mw / WORLD_W;
      const sy = mh / WORLD_H;
      const CS = CELL_SIZE;
      const pw = Math.max(1, CS * sx);
      const ph = Math.max(1, CS * sy);

      ctx.fillStyle = '#000811';
      ctx.fillRect(0, 0, mw, mh);

      // LINK cells
      ctx.fillStyle = '#007755';
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          if (this.grid.get(c, r).state === STATE.LINK) {
            ctx.fillRect(c * CS * sx, r * CS * sy, pw, ph);
          }
        }
      }

      // COMPONENT cells
      const mmColor = {
        [COMP.CPU]:           '#0066ff',
        [COMP.RAM]:           '#00ccff',
        [COMP.POWER]:         '#ff8800',
        [COMP.ENEMY_NODE]:    '#ff0044',
        [COMP.RESOURCE_NODE]: '#00ff66',
      };
      this.components.forEach(comp => {
        ctx.fillStyle = mmColor[comp.compType];
        ctx.fillRect(comp.col * CS * sx - 1, comp.row * CS * sy - 1, pw + 2, ph + 2);
      });
    }

    _updateMinimapViewport() {
      const ctx = this._mmCtx;
      const mw = 120, mh = 120;
      const sx = mw / WORLD_W;
      const sy = mh / WORLD_H;
      const W  = this.scale.width;
      const H  = this.scale.height;

      this._drawMinimapStatic();

      const vw = (W / this.zoom) * sx;
      const vh = (H / this.zoom) * sy;
      const vx = (this.camX - (W / this.zoom) / 2) * sx;
      const vy = (this.camY - (H / this.zoom) / 2) * sy;

      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 1;
      ctx.strokeRect(vx, vy, vw, vh);
    }

    // ── Camera ────────────────────────────────────────────────────────────────
    _clampCamera() {
      const W  = this.scale.width;
      const H  = this.scale.height;
      const hw = (W / 2) / this.zoom;
      const hh = (H / 2) / this.zoom;
      this.camX = Phaser.Math.Clamp(this.camX, hw, WORLD_W - hw);
      this.camY = Phaser.Math.Clamp(this.camY, hh, WORLD_H - hh);
    }

    _applyZoom(delta, pivotX, pivotY) {
      const W    = this.scale.width;
      const H    = this.scale.height;
      const oldZ = this.zoom;
      this.zoom  = Phaser.Math.Clamp(this.zoom + delta, ZOOM_MIN, ZOOM_MAX);
      const wpx  = this.camX + (pivotX - W / 2) / oldZ;
      const wpy  = this.camY + (pivotY - H / 2) / oldZ;
      this.camX  = wpx - (pivotX - W / 2) / this.zoom;
      this.camY  = wpy - (pivotY - H / 2) / this.zoom;
      this._clampCamera();
      this.cameras.main.setZoom(this.zoom);
    }

    // ── Click inspector ───────────────────────────────────────────────────────
    _handleClick(ptr) {
      const W   = this.scale.width;
      const H   = this.scale.height;
      const wx  = this.camX + (ptr.x - W / 2) / this.zoom;
      const wy  = this.camY + (ptr.y - H / 2) / this.zoom;
      const col = Math.floor(wx / CELL_SIZE);
      const row = Math.floor(wy / CELL_SIZE);
      const cell = this.grid.get(col, row);

      this.selectedCell = (cell && cell.state !== STATE.EMPTY) ? { col, row, cell } : null;
      this._refreshCellHUD();
    }

    _refreshCellHUD() {
      const el = document.getElementById('hud-cell-info');
      if (!this.selectedCell) { el.textContent = ''; return; }
      const { col, row, cell } = this.selectedCell;
      if (cell.state === STATE.COMPONENT) {
        el.innerHTML =
          `STATE: <span>COMPONENT</span><br>` +
          `TYPE&nbsp;: <span>${cell.compType}</span><br>` +
          `ID&nbsp;&nbsp;&nbsp;: <span>#${cell.id}</span>  CELL: <span>${col},${row}</span>`;
      } else {
        el.innerHTML =
          `STATE: <span>LINK</span><br>` +
          `FROM&nbsp;: <span>#${cell.fromId}</span> → <span>#${cell.toId}</span><br>` +
          `CELL&nbsp;: <span>${col},${row}</span>`;
      }
    }

    // ── Update loop ───────────────────────────────────────────────────────────
    update(_time, delta) {
      this.time_t += delta * 0.001;

      // FPS counter
      this.fpsCount++;
      this.fpsTimer += delta;
      if (this.fpsTimer >= 500) {
        this.fpsDisplay = Math.round(this.fpsCount / (this.fpsTimer / 1000));
        this.fpsCount = 0;
        this.fpsTimer = 0;
      }

      // Keyboard pan
      const speed = CAM_SPEED / this.zoom;
      if (this.cursors.left.isDown  || this.wasd.left.isDown)  this.camX -= speed;
      if (this.cursors.right.isDown || this.wasd.right.isDown) this.camX += speed;
      if (this.cursors.up.isDown    || this.wasd.up.isDown)    this.camY -= speed;
      if (this.cursors.down.isDown  || this.wasd.down.isDown)  this.camY += speed;
      this._clampCamera();
      this.cameras.main.centerOn(this.camX, this.camY);

      this._updateDynamic();

      // HUD
      const col = Math.floor(this.camX / CELL_SIZE);
      const row = Math.floor(this.camY / CELL_SIZE);
      document.getElementById('hud-coords').textContent = `SECTOR: ${col},${row}`;
      document.getElementById('hud-zoom').textContent   = `ZOOM: ${this.zoom.toFixed(2)}x`;
      document.getElementById('hud-fps').textContent    = `FPS: ${this.fpsDisplay}`;

      this._updateMinimapViewport();
    }

    // ── Dynamic layer (pulses, signals, selection) ────────────────────────────
    _updateDynamic() {
      const g = this.dynGfx;
      g.clear();
      const t  = this.time_t;
      const CS = CELL_SIZE;

      // Component pulse halos
      this.components.forEach(comp => {
        const cx  = comp.col * CS + CS / 2;
        const cy  = comp.row * CS + CS / 2;
        const ph  = Math.sin(t * comp.speed + comp.pulse);
        const r   = 22 + ph * 5;
        const al  = 0.06 + 0.09 * ((ph + 1) / 2);
        const pal = C[comp.compType];
        g.lineStyle(1.5, pal.glow, al);
        g.strokeCircle(cx, cy, r);
        g.lineStyle(1, pal.glow, al * 0.4);
        g.strokeCircle(cx, cy, r + 6);
      });

      // Signal dots travelling along link segments
      this.linkSegments.forEach((seg, i) => {
        if (seg.cells.length === 0) return;
        const period = 1.5 + (i % 5) * 0.5;
        const idx    = Math.floor(((t / period) % 1) * seg.cells.length);
        const c      = seg.cells[idx];
        if (!c) return;
        const cx = c.col * CS + CS / 2;
        const cy = c.row * CS + CS / 2;
        g.fillStyle(C.linkGlow, 0.95);
        g.fillCircle(cx, cy, 3);
        g.fillStyle(C.linkGlow, 0.18);
        g.fillCircle(cx, cy, 7);
      });

      // Selected cell highlight
      if (this.selectedCell) {
        const { col, row, cell } = this.selectedCell;
        const px    = col * CS;
        const py    = row * CS;
        const cx    = px + CS / 2;
        const cy    = py + CS / 2;
        const pulse = 0.5 + 0.5 * Math.sin(t * 4);

        g.lineStyle(2, C.select, pulse);
        g.strokeRect(px, py, CS, CS);

        if (cell.state === STATE.COMPONENT) {
          const pal = C[cell.compType];
          g.lineStyle(1, pal.glow, pulse * 0.9);
          g.strokeCircle(cx, cy, 28);
          const gap = CS / 2 + 3, arm = 14;
          g.lineStyle(1, C.select, pulse * 0.4);
          g.beginPath();
          g.moveTo(cx - gap - arm, cy); g.lineTo(cx - gap, cy);
          g.moveTo(cx + gap,       cy); g.lineTo(cx + gap + arm, cy);
          g.moveTo(cx, cy - gap - arm); g.lineTo(cx, cy - gap);
          g.moveTo(cx, cy + gap);       g.lineTo(cx, cy + gap + arm);
          g.strokePath();
        } else if (cell.state === STATE.LINK) {
          g.lineStyle(1, C.linkGlow, pulse * 0.7);
          g.strokeRect(px + 4, py + 4, CS - 8, CS - 8);
        }
      }
    }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // BOOT
  // ─────────────────────────────────────────────────────────────────────────────
  function boot() {
    new Phaser.Game({
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#000811',
      parent: 'game-container',
      scene: PCBScene,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      render: {
        antialias: true,
        powerPreference: 'high-performance',
      },
    });
  }

  const script   = document.createElement('script');
  script.src     = 'https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js';
  script.onload  = boot;
  script.onerror = () => {
    document.body.innerHTML =
      '<div style="color:#ff0044;padding:20px;font-family:monospace">' +
      'ERROR: Could not load Phaser 3. Check your internet connection.</div>';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
